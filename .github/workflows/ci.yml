name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # On PRs only run packages affected since master; on master run everything.
  FILTER: ${{ github.event_name == 'pull_request' && '...[origin/master]' || '*' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "$FILTER" --if-present run lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "$FILTER" --if-present run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "$FILTER" --if-present run test

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm licenses:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shadow-lingo/extension build
      - uses: actions/upload-artifact@v7
        with:
          name: extension-chrome-mv3
          path: apps/extension/.output/chrome-mv3
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: extension-chrome-mv3
          path: apps/extension/.output/chrome-mv3
      - run: pnpm --filter @shadow-lingo/extension exec playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum pnpm --filter @shadow-lingo/extension run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/extension/playwright-report
          retention-days: 7

  desktop:
    # Unsigned installers for each OS, built in parallel.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The offline translation model (~100 MB), fetched by the build at a pinned revision.
      - uses: actions/cache@v6
        with:
          path: packages/shell/.cache
          key: opus-mt-${{ hashFiles('packages/shell/scripts/fetch-model.mjs') }}
      - run: pnpm --filter @shadow-lingo/desktop run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/out/*.exe
            apps/desktop/out/*.dmg
            apps/desktop/out/*.AppImage
            apps/desktop/out/*.deb
          if-no-files-found: error
          retention-days: 7

  desktop-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # pnpm skips Electron's download script: fetch the binary for the test run.
      - run: node apps/desktop/node_modules/electron/install.js
      # The offline translation model (~100 MB), fetched by the build at a pinned revision.
      - uses: actions/cache@v6
        with:
          path: packages/shell/.cache
          key: opus-mt-${{ hashFiles('packages/shell/scripts/fetch-model.mjs') }}
      - run: pnpm --filter @shadow-lingo/desktop run build
      - run: xvfb-run --auto-servernum pnpm --filter @shadow-lingo/desktop run e2e
