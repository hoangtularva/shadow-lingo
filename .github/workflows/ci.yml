name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # On PRs only run packages affected since master; on master run everything.
  FILTER: ${{ github.event_name == 'pull_request' && '...[origin/master]' || '*' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "$FILTER" --if-present run lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "$FILTER" --if-present run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "$FILTER" --if-present run test

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm licenses:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shadow-lingo/extension build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-chrome-mv3
          path: apps/extension/.output/chrome-mv3
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-chrome-mv3
          path: apps/extension/.output/chrome-mv3
      - run: pnpm --filter @shadow-lingo/extension exec playwright install --with-deps chromium
      - run: xvfb-run --auto-servernum pnpm --filter @shadow-lingo/extension run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/extension/playwright-report
          retention-days: 7

  desktop:
    # Unsigned installers for each OS, built in parallel.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The offline translation model (~100 MB), fetched by the build at a pinned revision.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/shell/.cache
          key: opus-mt-${{ hashFiles('packages/shell/scripts/fetch-model.mjs') }}
      - run: pnpm --filter @shadow-lingo/desktop run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/out/*.exe
            apps/desktop/out/*.dmg
            apps/desktop/out/*.AppImage
            apps/desktop/out/*.deb
          if-no-files-found: error
          retention-days: 7

  desktop-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # pnpm skips Electron's download script: fetch the binary for the test run.
      - run: node apps/desktop/node_modules/electron/install.js
      # The offline translation model (~100 MB), fetched by the build at a pinned revision.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/shell/.cache
          key: opus-mt-${{ hashFiles('packages/shell/scripts/fetch-model.mjs') }}
      - run: pnpm --filter @shadow-lingo/desktop run build
      - run: xvfb-run --auto-servernum pnpm --filter @shadow-lingo/desktop run e2e

  android:
    # Debug APK of the Android app (artifact only; nothing is published).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: { distribution: temurin, java-version: 21, cache: gradle }
      # The offline translation model (~100 MB), fetched by the build at a pinned revision.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/shell/.cache
          key: opus-mt-${{ hashFiles('packages/shell/scripts/fetch-model.mjs') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shadow-lingo/mobile run build
      - run: pnpm --filter @shadow-lingo/mobile exec cap sync android
      - run: bash gradlew assembleDebug --console=plain
        working-directory: apps/mobile/android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    # iOS app for the simulator, unsigned (no Apple account needed), then a smoke run that
    # opens a video and saves screenshots. Nothing is published.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/shell/.cache
          key: opus-mt-${{ hashFiles('packages/shell/scripts/fetch-model.mjs') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shadow-lingo/mobile run build
      - run: pnpm --filter @shadow-lingo/mobile exec cap sync ios
      - name: Build for the simulator
        run: >
          xcodebuild -project apps/mobile/ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator -derivedDataPath ios-build
          CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Smoke run in the simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios-build/Build/Products/Debug-iphonesimulator/App.app
          mkdir -p ios-shots
          xcrun simctl launch "$UDID" io.github.hoangtularva.shadowlingo
          sleep 20
          xcrun simctl io "$UDID" screenshot ios-shots/home.png
          xcrun simctl terminate "$UDID" io.github.hoangtularva.shadowlingo
          # Debug builds only: open a video at launch (no link prompt in the simulator).
          xcrun simctl launch "$UDID" io.github.hoangtularva.shadowlingo -shadowLingoOpen 8KkKuTCFvzI
          sleep 40
          xcrun simctl io "$UDID" screenshot ios-shots/video.png
          sleep 40
          xcrun simctl io "$UDID" screenshot ios-shots/video-later.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-simulator
          path: ios-shots
          retention-days: 7
