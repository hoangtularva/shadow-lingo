<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Firefox only: it gives no microphone to an extension's background page. -->
    <meta name="manifest.include" content="['firefox']" />
    <title>ShadowLingo · Micro</title>
    <style>
      /* UI spec: MicWindowDark / MicWindowLight. */
      @font-face {
        font-family: 'SL Be Vietnam Pro';
        font-weight: 400;
        src: url('/fonts/be-vietnam-pro-vietnamese-400-normal.woff2') format('woff2');
        unicode-range:
          U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301,
          U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: 'SL Be Vietnam Pro';
        font-weight: 400;
        src: url('/fonts/be-vietnam-pro-latin-400-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'SL Be Vietnam Pro';
        font-weight: 600 700;
        src: url('/fonts/be-vietnam-pro-vietnamese-700-normal.woff2') format('woff2');
        unicode-range:
          U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301,
          U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
      }
      @font-face {
        font-family: 'SL Be Vietnam Pro';
        font-weight: 600 700;
        src: url('/fonts/be-vietnam-pro-latin-700-normal.woff2') format('woff2');
      }
      :root {
        --bg: #ffffff;
        --fg: #0f1115;
        --text: #4b5563;
        --note: #676d7b;
        --line: #f1f3f5;
        --logo-shadow: #c9ced6;
        --ready: #2f855a;
        --recording: #c62828;
        --blocked: #b7791f;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #171a20;
          --fg: #e7e9ee;
          --text: #c7cbd3;
          --note: #8b93a1;
          --line: #23272f;
          --logo-shadow: #3a3f48;
          --ready: #86e08f;
          --recording: #ff8a80;
          --blocked: #f5b544;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: 'SL Be Vietnam Pro', system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        height: 40px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        font-weight: 700;
      }
      header .accent {
        color: #f5b544;
      }
      .logo-shadow {
        fill: var(--logo-shadow);
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 16px;
      }
      #status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: var(--fg);
      }
      #dot {
        width: 10px;
        height: 10px;
        border-radius: 5px;
        background: var(--ready);
      }
      body[data-state='recording'] #dot {
        background: var(--recording);
      }
      body[data-state='blocked'] #dot {
        background: var(--blocked);
      }
      p {
        margin: 0;
        font-size: 13px;
        line-height: 1.55;
        color: var(--text);
      }
      .note {
        margin-top: auto;
        font-size: 11px;
        color: var(--note);
      }
    </style>
  </head>
  <body data-state="ready">
    <header>
      <svg width="20" height="20" viewBox="0 0 120 120" aria-hidden="true">
        <path
          class="logo-shadow"
          d="M34 22 H86 A16 16 0 0 1 102 38 V62 A16 16 0 0 1 86 78 H52 L36 92 V78 H34 A16 16 0 0 1 18 62 V38 A16 16 0 0 1 34 22 Z"
          transform="translate(8 8)"
        />
        <path
          d="M34 22 H86 A16 16 0 0 1 102 38 V62 A16 16 0 0 1 86 78 H52 L36 92 V78 H34 A16 16 0 0 1 18 62 V38 A16 16 0 0 1 34 22 Z"
          fill="#F5B544"
        />
        <path
          d="M44 48 Q60 62 76 48"
          fill="none"
          stroke="#15171C"
          stroke-width="7"
          stroke-linecap="round"
        />
      </svg>
      <span>Shadow<span class="accent">Lingo</span> · Micro</span>
    </header>
    <main>
      <p id="status" role="status" aria-live="polite">
        <span id="dot" aria-hidden="true"></span><span id="status-text">Micro sẵn sàng</span>
      </p>
      <p id="text">
        Cửa sổ này giữ micro để bạn luyện nói trên Firefox. Bạn có thể thu nhỏ, nhưng đừng đóng khi
        đang luyện. Mọi thao tác vẫn bấm trong khung ShadowLingo cạnh video.
      </p>
      <p class="note">Bản ghi chỉ nằm trên máy bạn, không gửi đi bất kỳ đâu.</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
