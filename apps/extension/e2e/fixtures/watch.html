<!doctype html>
<html dark>
  <head>
    <meta charset="utf-8" />
    <title>Fixture watch page</title>
    <style>
      html {
        font-size: 10px;
      }
      body {
        margin: 0;
        background: #0f0f0f;
        color: #fff;
        font-family: sans-serif;
      }
      ytd-watch-flexy {
        display: flex;
        gap: 24px;
        padding: 24px;
      }
      #primary {
        flex: 0 0 auto;
      }
      #movie_player {
        width: 640px;
        height: 360px;
        background: #000;
      }
      #secondary {
        width: 420px;
        flex: 0 0 420px;
      }
    </style>
  </head>
  <body>
    <ytd-app>
      <ytd-watch-flexy>
        <div id="primary">
          <div id="movie_player">
            <video class="html5-main-video" width="640" height="360"></video>
            <button class="ytp-subtitles-button" aria-pressed="false">CC</button>
          </div>
        </div>
        <div id="secondary">
          <div id="secondary-inner"><div id="related">Related videos</div></div>
        </div>
      </ytd-watch-flexy>
    </ytd-app>
    <script>
      // Mimics the player: it requests captions itself (with a token the extension must ignore).
      function loadCaptions(v, asr, lang) {
        const xhr = new XMLHttpRequest();
        xhr.open(
          'GET',
          '/api/timedtext?v=' +
            v +
            '&lang=' +
            (lang || 'en') +
            (asr ? '&kind=asr' : '') +
            '&fmt=json3&pot=FAKE_PO_TOKEN',
        );
        xhr.send();
      }
      function navigate(v) {
        history.pushState({}, '', '/watch?v=' + v);
        document.dispatchEvent(new CustomEvent('yt-navigate-finish', { bubbles: true }));
      }
      window.fixture = { loadCaptions, navigate };
      // CC button: the player loads captions only once it is pressed.
      const cc = document.querySelector('.ytp-subtitles-button');
      cc.addEventListener('click', () => {
        const on = cc.getAttribute('aria-pressed') !== 'true';
        cc.setAttribute('aria-pressed', String(on));
      });
      const v = new URLSearchParams(location.search).get('v');
      // A video with burned-in subtitles (drawn on a canvas, streamed into the <video>).
      if (v === 'ocrVideo001') {
        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = 360;
        const g = canvas.getContext('2d');
        const lines = [
          'So what do we do now?',
          'I think we should figure it out together.',
          "Let's start with the easy part.",
        ];
        const t0 = performance.now();
        const draw = () => {
          const t = (performance.now() - t0) / 1000;
          g.fillStyle = '#20304a';
          g.fillRect(0, 0, 640, 360);
          g.fillStyle = '#6a7a9a';
          g.fillRect(60, 40, 200, 200);
          // Blank first (the OCR engine loads), then one subtitle every 3 s.
          const line = t < 4 ? '' : lines[Math.floor((t - 4) / 3)];
          if (line) {
            g.font = 'bold 26px Arial';
            g.textAlign = 'center';
            g.lineWidth = 5;
            g.strokeStyle = '#000';
            g.strokeText(line, 320, 320);
            g.fillStyle = '#fff';
            g.fillText(line, 320, 320);
          }
          requestAnimationFrame(draw);
        };
        draw();
        const video = document.querySelector('video');
        video.srcObject = canvas.captureStream(15);
        video.muted = true;
        video.play();
      }
      if (v !== 'noCaptions01') {
        // A pre-roll ad's captions arrive first and must be ignored.
        loadCaptions('adVideo0001', false);
        loadCaptions(v, v.startsWith('asr'));
      }
    </script>
  </body>
</html>
